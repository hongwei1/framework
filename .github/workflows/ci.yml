name: CI

on:
  push:
    branches: [ lift-persistence ]
  pull_request:
    branches: [ lift-persistence ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Run tests (cross-compile 2.12 + 2.13)
        run: sbt -batch "+test"
